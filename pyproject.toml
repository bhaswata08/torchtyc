[project]
name = "torchtyc"
version = "0.1.0"
description = "Static array shape checking for PyTorch powered by meta tensors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jaxtyping>=0.3",
]

[project.optional-dependencies]
lsp = ["pygls>=1.3"]
watch = ["watchfiles>=0.24"]
einops = ["einops>=0.8"]
all = ["pygls>=1.3", "watchfiles>=0.24", "einops>=0.8"]

[project.scripts]
torchtyc = "torchtyc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torchtyc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "torch>=2.4",
    "einops>=0.8",
    "pygls>=1.3",
    "watchfiles>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
# These files exist to be wrong. That is the point of them.
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/bhaswata08/torchtyc"
Repository = "https://github.com/bhaswata08/torchtyc"
Issues = "https://github.com/bhaswata08/torchtyc/issues"
